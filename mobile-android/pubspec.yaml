name: ministrant_manager
description: Ministrant Manager — natywna aplikacja mobilna z obsługą offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0' # required by Drift >=2.32's sqlite3 3.x support and its build-hook config below

dependencies:
  flutter:
    sdk: flutter

  # Local database (offline-first storage), ENCRYPTED at rest (spec §4 / RODO —
  # this SQLite file holds personal data: altar-server names, attendance,
  # points), via SQLite3MultipleCiphers EXCLUSIVELY.
  #
  # Review round 3, point 1 fix: `sqlite3mc` is NOT a separate package
  # dependency — that was wrong in the previous round. SQLite3MultipleCiphers
  # is selected via a `hooks.user_defines` entry in THIS pubspec.yaml (see
  # the top-level `hooks:` key near the bottom of this file), which
  # configures the `sqlite3` package's own build-hook mechanism to fetch/
  # build the SQLite3MultipleCiphers-enabled native library. There is no
  # `hooks/build.dart` to write by hand — the hook lives inside the
  # `sqlite3` package itself, driven purely by this `user_defines` config.
  #
  # Versions matter here: Drift's support for sqlite3 v3.x (and this
  # build-hook mechanism) landed in Drift 2.32 — NOT 2.21, which predates
  # it. `drift`, `drift_dev` (dev_dependencies below), and `sqlite3` are
  # pinned to a mutually-compatible set on that basis.
  #
  # ⚠ VERIFY AT IMPLEMENTATION TIME (docs/ENCRYPTION.md has the full
  # checklist): this sandbox has no pub.dev access, so these exact version
  # numbers could not be confirmed against the live registry — confirm
  # before running `flutter pub get` for real. Do NOT add
  # `sqlite3_flutter_libs` or `sqlcipher_flutter_libs` — both provide a
  # conflicting native sqlite3 binary.
  drift: ^2.32.0
  sqlite3: ^3.0.0
  meta: ^1.15.0 # @visibleForTesting on AppDatabase.forTesting()
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure token / key storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.4.3

  # QR scanning (activation flow)
  mobile_scanner: ^5.1.1

  # QR rendering (not currently used client-side — QR is generated server-side —
  # kept available in case the admin panel ever needs client-rendered QR previews)
  qr_flutter: ^4.1.0

  # Connectivity awareness for the offline banner / sync triggers
  connectivity_plus: ^6.0.3

  # UUID generation for installation_id / client_action_id
  uuid: ^4.4.0

  # State management
  flutter_riverpod: ^2.5.1

  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Opening the store listing from the forced-update screen (spec §29/§30
  # — store URLs come from GET /api/client-config, never hardcoded).
  url_launcher: ^6.3.0
  # Android App Links / iOS Universal Links (spec §35): receives the
  # https://app.ministrant.eu/activate/{token} link when the OS hands it
  # straight to the app instead of opening it in a browser. Inert until
  # the platform config in decision #9's docs-app-links.md is filled in
  # with real values — until then, every scanned QR opens the fallback
  # web page instead, which is the correct/safe degradation.
  app_links: ^6.3.2

  # Hybrid dashboard milestone: the generic secure WebView shell
  # (LegacyModuleScreen) that hosts legacy PHP modules the app doesn't
  # (yet, or ever) reimplement natively. ⚠ VERIFY AT IMPLEMENTATION TIME
  # (same caveat as drift/sqlite3 above) — no pub.dev access from this
  # sandbox to confirm this exact version against the live registry.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.32.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Review round 3, point 1 fix: THIS is the actual SQLite3MultipleCiphers
# configuration — a `user_defines` entry telling the `sqlite3` package's
# own build hook which native source variant to fetch/build, not a
# separate dependency and not a hand-written `hooks/build.dart`. See
# docs/ENCRYPTION.md for what is and isn't verified about this.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
