name: Android build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub restricts the `secrets` context from `if:` conditions
    # entirely (job- and step-level) — it is only usable as a VALUE
    # (env:, with:, run:), never inside a condition. Real error hit on
    # first CI run: "context 'secrets' is not allowed here" — the
    # workflow failed to parse at all (zero jobs created). The standard
    # workaround: surface presence-as-boolean through job-level `env:`
    # (secrets ARE allowed there), then branch on `env.*` in `if:`.
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
      HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
    defaults:
      run:
        working-directory: mobile-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # ships Dart >=3.7, required by drift ^2.32.0
          channel: 'stable'

      # Review round 3.x point 11: `flutter create` removed from CI
      # entirely. The full native Android project (Kotlin DSL Gradle
      # files, gradle wrapper, manifest, etc.) is now committed directly
      # in this repo — generated once against Flutter 3.47.3 and
      # hand-verified, not regenerated before every build. CI now only
      # builds what's actually in the repo.
      - run: flutter pub get
      - name: Generate branded splash screens
        run: dart run flutter_native_splash:create
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Validate Android signing secret set
        run: |
          configured=0
          for flag in "$HAS_ANDROID_KEYSTORE" "$HAS_ANDROID_STORE_PASSWORD" "$HAS_ANDROID_KEY_ALIAS" "$HAS_ANDROID_KEY_PASSWORD"; do
            if [ "$flag" = "true" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "Android release signing is only partially configured. Set all four ANDROID_* secrets or none of them."
            exit 1
          fi

      # Debug build needs no signing secrets — always runs. Release build
      # (signed app-release.aab) only runs once all four repo secrets
      # exist; until then this step is a no-op rather than a failure, so
      # the workflow stays green for everyone before a keystore exists.
      - name: Decode and verify release keystore (if configured)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && env.HAS_ANDROID_STORE_PASSWORD == 'true' && env.HAS_ANDROID_KEY_ALIAS == 'true' && env.HAS_ANDROID_KEY_PASSWORD == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

          cat > android/key.properties << KEYPROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          KEYPROPS

          test -s android/release.keystore
          keytool -list \
            -keystore android/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build debug APK (always)
        run: flutter build apk --debug

      - name: Validate release AAB with ephemeral CI key (when production signing is absent)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'false' && env.HAS_ANDROID_STORE_PASSWORD == 'false' && env.HAS_ANDROID_KEY_ALIAS == 'false' && env.HAS_ANDROID_KEY_PASSWORD == 'false' }}
        run: |
          set -euo pipefail
          umask 077

          keytool -genkeypair -noprompt \
            -keystore android/ci-release-test.keystore \
            -storepass ci-release-test-password \
            -keypass ci-release-test-password \
            -alias ci-release-test \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Ministrant Manager CI,O=Ministrant Manager,C=PL"

          cat > android/key.properties << KEYPROPS
          storePassword=ci-release-test-password
          keyPassword=ci-release-test-password
          keyAlias=ci-release-test
          storeFile=ci-release-test.keystore
          KEYPROPS

          flutter build appbundle --release

          rm -f android/key.properties android/ci-release-test.keystore
          rm -f build/app/outputs/bundle/release/*.aab

      - name: Build release APK + AAB (only if keystore secrets are configured)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && env.HAS_ANDROID_STORE_PASSWORD == 'true' && env.HAS_ANDROID_KEY_ALIAS == 'true' && env.HAS_ANDROID_KEY_PASSWORD == 'true' }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: |
            mobile-android/build/app/outputs/flutter-apk/*.apk
            mobile-android/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
