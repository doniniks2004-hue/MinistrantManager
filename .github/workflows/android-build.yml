name: Android build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub restricts the `secrets` context from `if:` conditions
    # entirely (job- and step-level) — it is only usable as a VALUE
    # (env:, with:, run:), never inside a condition. Real error hit on
    # first CI run: "context 'secrets' is not allowed here" — the
    # workflow failed to parse at all (zero jobs created). The standard
    # workaround: surface presence-as-boolean through job-level `env:`
    # (secrets ARE allowed there), then branch on `env.*` in `if:`.
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0' # ships Dart 3.6.0 — matches pubspec.yaml's 'sdk: >=3.6.0' constraint (Drift >=2.32/sqlite3 3.x). Review round 3, point 2: 3.24.0 shipped Dart 3.5.x and would have failed `flutter pub get` on this SDK constraint.
          channel: 'stable'

      - name: Snapshot our customized files BEFORE flutter create
        run: |
          mkdir -p /tmp/pre-create-snapshot
          cp android/app/src/main/AndroidManifest.xml /tmp/pre-create-snapshot/
          cp android/app/build.gradle /tmp/pre-create-snapshot/

      - name: flutter create (regenerate gradle wrapper + missing native scaffolding)
        run: flutter create --org eu.ministrant --project-name ministrant_manager --platforms android .

      - name: Verify flutter create did NOT overwrite our App Links / camera-permission customizations
        # Iteration 1.1 point 13: `flutter create` on an existing project
        # does not overwrite files by default (no --overwrite flag passed
        # above) — but that default behavior is exactly the kind of thing
        # that silently changes between Flutter versions. This step turns
        # "we assume it's safe" into an actual, enforced check: byte-for-byte
        # diff against the pre-create snapshot, AND a grep for our App
        # Links marker comment, either of which failing fails the build
        # loudly instead of shipping a manifest that silently lost its
        # App Links intent-filter or camera permission.
        run: |
          diff /tmp/pre-create-snapshot/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          diff /tmp/pre-create-snapshot/build.gradle android/app/build.gradle
          grep -q "Android App Links (spec §35" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Debug build needs no signing secrets — always runs. Release build
      # (signed app-release.aab) only runs once these three repo secrets
      # exist; until then this step is a no-op rather than a failure, so
      # the workflow stays green for everyone before a keystore exists.
      - name: Decode release keystore (if configured)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/key.properties << KEYPROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          KEYPROPS

      - name: Build debug APK (always)
        run: flutter build apk --debug

      - name: Build release APK + AAB (only if keystore secrets are configured)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: |
            mobile-android/build/app/outputs/flutter-apk/*.apk
            mobile-android/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
