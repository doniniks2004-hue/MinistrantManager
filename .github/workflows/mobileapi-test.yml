name: MobileAPI tests

# This one CAN actually run as-is (unlike backend-test.yml / android-build.yml
# / ios-build.yml) — every test under Tests/ is framework-free plain PHP,
# exactly what was executed manually during Iteration 1 development (see
# docs/TESTING.md). This workflow is the automated version of
# `bash Tests/run_all.sh`.

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ministrant_mobile_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: mobileapi
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli

      - name: Syntax-check every PHP file
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Run framework-free tests
        run: bash Tests/run_all.sh

      - name: Syntax-check deployment PHP
        working-directory: .
        run: find mobileapi-core-deployment -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Test universal installer structure
        working-directory: .
        run: php mobileapi-core-deployment/tests/installer_structure_test.php

      - name: Test routing updates, rollback entries and mysqlnd independence
        working-directory: .
        run: php mobileapi-core-deployment/tests/routing_config_test.php

      - name: Test exact rollback and invalid backup rejection
        working-directory: .
        run: php mobileapi-core-deployment/tests/rollback_test.php

      - name: Test login denial when rate-limit storage is unavailable
        working-directory: .
        run: php -n mobileapi-core-deployment/tests/login_limiter_test.php

      - name: Test login limiter and migration against MySQL
        working-directory: .
        run: php mobileapi-core-deployment/tests/login_mysql_test.php

      - name: Test fresh installation and reinstallation against MySQL
        working-directory: .
        run: php mobileapi-core-deployment/tests/installer_mysql_test.php

      - name: Test authenticated browser installer without shell functions
        working-directory: .
        run: php mobileapi-core-deployment/tests/browser_installer_test.php

      - name: Test handoff diagnostics (hashes stay in step with the repo; no secret can be printed)
        working-directory: .
        run: php mobileapi-core-deployment/tests/diagnose_handoff_test.php

      - name: Build universal parish installer ZIP
        working-directory: .
        run: |
          rm -f universal-parish-installer.zip
          cd mobileapi-core-deployment
          zip -rq ../universal-parish-installer.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: universal-parish-installer
          path: universal-parish-installer.zip
          if-no-files-found: error
