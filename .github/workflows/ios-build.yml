name: iOS build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    # Same fix as android-build.yml: `secrets` context is not allowed in
    # `if:` conditions at all — surfaced as job-level env vars instead.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: mobile-ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # ships Dart >=3.7, required by drift ^2.32.0
          channel: 'stable'

      # Review round 3.x point 11: `flutter create` removed from CI
      # entirely — see android-build.yml's identical comment. The full
      # native iOS project (Xcode project/workspace, Podfile, entitlements,
      # Info.plist) is committed directly in this repo, generated once
      # against Flutter 3.47.3 and hand-verified (bundle identifier and
      # deployment target reconciled between Info.plist and project.pbxproj).
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: pod install
        run: cd ios && pod install

      # Per spec decision #1/#3: unsigned/simulator build where no Apple
      # Developer certificate exists yet — this always runs and proves the
      # Xcode project + Dart code actually compile for iOS. The signed
      # IPA/TestFlight step below only runs once the four secrets exist.
      - name: Build for iOS simulator (unsigned, always runs)
        run: flutter build ios --simulator --no-codesign

      - name: Import signing certificate + provisioning profile (only if configured)
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA (only if configured — requires APPLE_TEAM_ID too)
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        run: flutter build ipa --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-outputs
          path: mobile-ios/build/ios/ipa/*.ipa
          if-no-files-found: warn
