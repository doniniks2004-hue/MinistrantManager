name: iOS build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: mobile-ios

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: pod install
        run: cd ios && pod install

      - name: Validate iOS signing secret set
        run: |
          configured=0
          for flag in "$HAS_APPLE_CERT" "$HAS_APPLE_CERT_PASSWORD" "$HAS_APPLE_PROFILE" "$HAS_APPLE_TEAM_ID"; do
            if [ "$flag" = "true" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "iOS release signing is only partially configured. Set all four APPLE_* secrets or none of them."
            exit 1
          fi

      - name: Build for iOS simulator (unsigned, always runs)
        run: flutter build ios --simulator --no-codesign

      - name: Import certificate and provisioning profile
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_CERT_PASSWORD == 'true' && env.HAS_APPLE_PROFILE == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/mm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "Provisioning profile Team ID is '$PROFILE_TEAM_ID', but APPLE_TEAM_ID is '$APPLE_TEAM_ID'."
            exit 1
          fi

          if [ "$PROFILE_BUNDLE_ID" != "eu.ministrant.manager" ]; then
            echo "Provisioning profile bundle id is '$PROFILE_BUNDLE_ID', expected 'eu.ministrant.manager'."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > ios/Flutter/Signing.xcconfig <<EOF
          DEVELOPMENT_TEAM=$APPLE_TEAM_ID
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID
          CODE_SIGN_IDENTITY=Apple Distribution
          EOF

          cat > ios/ExportOptions.generated.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>eu.ministrant.manager</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_CERT_PASSWORD == 'true' && env.HAS_APPLE_PROFILE == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.generated.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-outputs
          path: mobile-ios/build/ios/ipa/*.ipa
          if-no-files-found: warn
