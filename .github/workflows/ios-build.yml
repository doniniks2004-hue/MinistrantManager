name: iOS build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: 'Require complete production signing (fail if missing)'
        type: boolean
        default: false
      upload_testflight:
        description: 'After building the signed IPA, upload it to TestFlight (needs the signing secrets AND the three APP_STORE_CONNECT_* secrets)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
      HAS_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
      HAS_ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile-ios

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      - run: flutter pub get --enforce-lockfile
      - name: Generate branded splash screens
        run: dart run flutter_native_splash:create
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: pod install
        run: cd ios && pod install

      - name: Validate iOS signing secret set
        run: |
          configured=0
          for flag in "$HAS_APPLE_CERT" "$HAS_APPLE_CERT_PASSWORD" "$HAS_APPLE_PROFILE" "$HAS_APPLE_TEAM_ID"; do
            if [ "$flag" = "true" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "iOS release signing is only partially configured. Set all four APPLE_* secrets or none of them."
            exit 1
          fi
          if [ "${{ inputs.production }}" = "true" ] && [ "$configured" -ne 4 ]; then
            echo "Production build requires complete signing secrets."
            exit 1
          fi

      - name: Signing and TestFlight readiness (what is missing, by name)
        run: |
          # Names only, never values. Missing secrets are REPORTED, not worked
          # around: no certificate or profile is ever generated here.
          row() { if [ "$2" = "true" ]; then echo "| \`$1\` | set |"; else echo "| \`$1\` | **missing** |"; fi; }
          {
            echo "## iOS release readiness"
            echo
            echo "| Secret | State |"
            echo "|---|---|"
            row APPLE_CERTIFICATE_BASE64 "$HAS_APPLE_CERT"
            row APPLE_CERTIFICATE_PASSWORD "$HAS_APPLE_CERT_PASSWORD"
            row APPLE_PROVISIONING_PROFILE_BASE64 "$HAS_APPLE_PROFILE"
            row APPLE_TEAM_ID "$HAS_APPLE_TEAM_ID"
            row APP_STORE_CONNECT_KEY_ID "$HAS_ASC_KEY_ID"
            row APP_STORE_CONNECT_ISSUER_ID "$HAS_ASC_ISSUER_ID"
            row APP_STORE_CONNECT_API_KEY_BASE64 "$HAS_ASC_API_KEY"
            echo
            if [ "$HAS_APPLE_CERT" = "true" ] && [ "$HAS_APPLE_CERT_PASSWORD" = "true" ] && [ "$HAS_APPLE_PROFILE" = "true" ] && [ "$HAS_APPLE_TEAM_ID" = "true" ]; then
              echo "A signed IPA will be built."
            else
              echo "No signed IPA will be built: the four \`APPLE_*\` secrets need a paid Apple Developer Program membership (see mobile-ios/docs/IOS-RUNTIME-VERIFICATION.md, section 'What is left for TestFlight')."
            fi
            if [ "$HAS_ASC_KEY_ID" = "true" ] && [ "$HAS_ASC_ISSUER_ID" = "true" ] && [ "$HAS_ASC_API_KEY" = "true" ]; then
              echo "Upload to TestFlight is possible (run this workflow manually with \`upload_testflight\`)."
            else
              echo "Upload to TestFlight is not possible yet: the three \`APP_STORE_CONNECT_*\` secrets are an App Store Connect API key (Users and Access, Integrations)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY" | tail -20 || true

      - name: Validate the TestFlight upload request
        if: ${{ inputs.upload_testflight == true }}
        run: |
          missing=""
          [ "$HAS_APPLE_CERT" = "true" ] || missing="$missing APPLE_CERTIFICATE_BASE64"
          [ "$HAS_APPLE_CERT_PASSWORD" = "true" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ "$HAS_APPLE_PROFILE" = "true" ] || missing="$missing APPLE_PROVISIONING_PROFILE_BASE64"
          [ "$HAS_APPLE_TEAM_ID" = "true" ] || missing="$missing APPLE_TEAM_ID"
          [ "$HAS_ASC_KEY_ID" = "true" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ "$HAS_ASC_ISSUER_ID" = "true" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ "$HAS_ASC_API_KEY" = "true" ] || missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Uploading to TestFlight was requested, but these secrets are not set:$missing"
            exit 1
          fi

      - name: Build for iOS simulator (unsigned, always runs)
        run: flutter build ios --simulator --no-codesign

      # Compile the actual iPhone target even before Apple signing is available.
      # Simulator compilation alone does not validate device-only plugin code,
      # the ARM64 link, or release/AOT compilation. This app is NOT installable.
      - name: Build for iPhone ARM64 (release, unsigned)
        run: |
          flutter build ios --release --no-codesign --dart-define=GIT_SHA=${{ github.sha }}
          xcrun lipo -verify_arch arm64 build/ios/iphoneos/Runner.app/Runner
          xcrun lipo -verify_arch arm64 build/ios/iphoneos/Runner.app/Frameworks/App.framework/App
          echo "iPhone ARM64 release compilation PASS; signing and device acceptance are still required." >> "$GITHUB_STEP_SUMMARY"

      - name: Import certificate and provisioning profile
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_CERT_PASSWORD == 'true' && env.HAS_APPLE_PROFILE == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/mm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "Provisioning profile Team ID is '$PROFILE_TEAM_ID', but APPLE_TEAM_ID is '$APPLE_TEAM_ID'."
            exit 1
          fi

          if [ "$PROFILE_BUNDLE_ID" != "eu.ministrant.manager" ]; then
            echo "Provisioning profile bundle id is '$PROFILE_BUNDLE_ID', expected 'eu.ministrant.manager'."
            exit 1
          fi

          # The Runner target applies Runner.entitlements, which declares
          # Associated Domains (Universal Links). A profile without that
          # capability makes the signing step fail with a message that does not
          # say why, after the whole build has run. Say it here, first.
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "The provisioning profile does not include the Associated Domains capability."
            echo "Enable it for the App ID eu.ministrant.manager in the Apple Developer portal and regenerate the profile."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > ios/Flutter/Signing.xcconfig <<EOF
          DEVELOPMENT_TEAM=$APPLE_TEAM_ID
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID
          CODE_SIGN_IDENTITY=Apple Distribution
          EOF

          cat > ios/ExportOptions.generated.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>eu.ministrant.manager</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Release gate (the project must be something App Store Connect accepts)
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_CERT_PASSWORD == 'true' && env.HAS_APPLE_PROFILE == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        # Fails, with the reason, on what App Store Connect would refuse AFTER the
        # build: an iPad declaration with Portrait only (the first release is
        # iPhone only, decided 16.10.2026, and pinned by every run), a missing
        # camera text, a loosened App Transport Security. See
        # .github/scripts/ios_static_checks.py.
        run: python3 ../.github/scripts/ios_static_checks.py --root .. --release-gate

      - name: Build signed IPA
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_CERT_PASSWORD == 'true' && env.HAS_APPLE_PROFILE == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        # App Store Connect rejects a build number it has already seen for this
        # version, and pubspec.yaml's "+N" only changes when somebody edits it.
        # The workflow's own run number only ever goes up.
        run: flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.generated.plist

      - name: Verify the signed IPA (what is really inside it)
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_CERT_PASSWORD == 'true' && env.HAS_APPLE_PROFILE == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls build/ios/ipa/*.ipa | head -n 1)"
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP="$WORK/Payload/Runner.app"

          # The bundle: id, version, Info.plist, privacy manifest, minimum iOS.
          python3 ../.github/scripts/ios_static_checks.py --root .. --built "$APP" --release-gate

          # The signature and the entitlements the app was REALLY signed with.
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$WORK/entitlements.plist" 2>/dev/null
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$WORK/entitlements.plist")
          if [ "$APP_ID" != "$APPLE_TEAM_ID.eu.ministrant.manager" ]; then
            echo "::error::signed application-identifier is '$APP_ID', expected '$APPLE_TEAM_ID.eu.ministrant.manager'"; exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' "$WORK/entitlements.plist" | grep -q 'applinks:app.ministrant.eu'; then
            echo "::error::the signed app does not carry applinks:app.ministrant.eu (Universal Links would not work)"; exit 1
          fi
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$WORK/entitlements.plist" 2>/dev/null || echo false)
          if [ "$GET_TASK_ALLOW" = "true" ]; then
            echo "::error::get-task-allow is true: this is a development signature, App Store Connect will refuse it"; exit 1
          fi
          echo "signed IPA verified: $APP_ID, associated domain present, distribution signature"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-outputs
          path: mobile-ios/build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight == true }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          IPA="$(ls build/ios/ipa/*.ipa | head -n 1)"
          mkdir -p "$HOME/.private_keys"
          KEY_FILE="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$ASC_API_KEY_BASE64" | base64 -D > "$KEY_FILE"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "uploaded to App Store Connect; processing and TestFlight availability follow on Apple's side"

