name: iOS build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    # Same fix as android-build.yml: `secrets` context is not allowed in
    # `if:` conditions at all — surfaced as job-level env vars instead.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: mobile-ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # bumped per confirmed CI log: drift_dev ^2.32.0's own deps need Dart >=3.7, which 3.27.0's Dart 3.6.0 doesn't satisfy.
          channel: 'stable'

      - name: Snapshot our customized files BEFORE flutter create
        run: |
          mkdir -p /tmp/pre-create-snapshot
          cp ios/Runner/Info.plist /tmp/pre-create-snapshot/
          cp ios/Runner/Runner.entitlements /tmp/pre-create-snapshot/
          cp ios/Podfile /tmp/pre-create-snapshot/

      - name: flutter create (regenerate Xcode project + missing native scaffolding)
        run: flutter create --no-pub --org eu.ministrant --project-name ministrant_manager --platforms ios .

      - name: Verify flutter create did NOT overwrite our Universal Links / camera-permission customizations
        # Iteration 1.1 point 13 — see android-build.yml's identical step
        # for the full rationale: turns "flutter create shouldn't overwrite
        # existing files" from an assumption into an enforced check.
        run: |
          diff /tmp/pre-create-snapshot/Info.plist ios/Runner/Info.plist
          diff /tmp/pre-create-snapshot/Runner.entitlements ios/Runner/Runner.entitlements
          diff /tmp/pre-create-snapshot/Podfile ios/Podfile
          grep -q "applinks:app.ministrant.eu" ios/Runner/Runner.entitlements

      # ONE-TIME step (review round 3.x point 11) — see android-build.yml's
      # identical step for the full rationale. `git pull --rebase` first
      # because this job runs IN PARALLEL with android-build.yml's own
      # commit-back step on the same push; if Android's commit lands
      # first, this avoids a plain non-fast-forward push failure for the
      # (unrelated, different-subdirectory) iOS scaffold commit.
      - name: Commit generated native scaffold (one-time; no-op afterwards)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ios/
          git diff --cached --quiet && echo "Nothing new to commit — scaffold already committed." || git commit -m "Commit Flutter-generated native iOS scaffold (Xcode project etc.) [skip ci reason: one-time, see workflow comment]"
          git pull --rebase origin main || true
          git push || echo "Push skipped/failed (e.g. nothing to push, or lost a race with android-build.yml's own commit) — not fatal to this build; re-run via workflow_dispatch if needed."

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: pod install
        run: cd ios && pod install

      # Per spec decision #1/#3: unsigned/simulator build where no Apple
      # Developer certificate exists yet — this always runs and proves the
      # Xcode project + Dart code actually compile for iOS. The signed
      # IPA/TestFlight step below only runs once the four secrets exist.
      - name: Build for iOS simulator (unsigned, always runs)
        run: flutter build ios --simulator --no-codesign

      - name: Import signing certificate + provisioning profile (only if configured)
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA (only if configured — requires APPLE_TEAM_ID too)
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        run: flutter build ipa --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-outputs
          path: mobile-ios/build/ios/ipa/*.ipa
          if-no-files-found: warn
