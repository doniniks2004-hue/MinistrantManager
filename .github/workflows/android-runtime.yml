name: Android emulator runtime
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: google_apis
            page-size: 4096
          - target: google_apis_ps16k
            page-size: 16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
      - name: Validate test verdict helper
        run: python3 .github/scripts/test_android_runtime_smoke.py
      - name: Build both test APKs
        working-directory: mobile-android
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_native_splash:create
          mkdir -p "$GITHUB_WORKSPACE/runtime-apks"
          flutter build apk --debug --target-platform android-x64 -t lib/selftest/main_selftest.dart
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/runtime-apks/selftest.apk"
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/runtime-apks/production.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: false
          script: python3 .github/scripts/android_runtime_smoke.py --selftest-apk runtime-apks/selftest.apk --production-apk runtime-apks/production.apk --expected-page-size ${{ matrix.page-size }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-report-${{ matrix.page-size }}
          path: android-runtime-results
          if-no-files-found: warn
