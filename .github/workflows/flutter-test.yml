name: Flutter analyze + test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-android
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # bumped per confirmed CI log: drift_dev ^2.32.0's own deps need Dart >=3.7, which 3.27.0's Dart 3.6.0 doesn't satisfy.
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      - name: Verify test/ directory is present and non-empty
        # Iteration 1.1 point 1 (this review round): `flutter test` with
        # no arguments silently reports "0 tests passed" if the test/
        # directory were ever empty or excluded — that would look like a
        # green pipeline while testing nothing. This step fails loudly
        # instead, BEFORE `flutter test` runs, if the 7 test files this
        # iteration added aren't actually there.
        run: |
          test -d test
          count=$(find test -name "*_test.dart" | wc -l)
          echo "Found $count test file(s) under test/"
          if [ "$count" -lt 10 ]; then
            echo "Expected at least 10 test files (offline_lease, module_version_gate, activation_service, config_service, dashboard_renderer, device_status_interpretation, pending_action_json_roundtrip, preflight_gate, deep_link_service, sync_safety_cap) — found $count. Failing rather than silently running fewer tests than intended."
            exit 1
          fi

      - name: flutter test
        # No --reporter flag needed for pass/fail: `flutter test` exits
        # non-zero on ANY failing test, which fails this step, which fails
        # the job — no `|| true`, no continue-on-error, anywhere in this
        # workflow. `flutter test` also runs every file under test/
        # recursively by default, so all 7 files verified above are
        # actually executed by this one command, not cherry-picked.
        run: flutter test
