name: Flutter analyze + test

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-android, mobile-ios]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # bumped per confirmed CI log: drift_dev ^2.32.0's own deps need Dart >=3.7, which 3.27.0's Dart 3.6.0 doesn't satisfy.
          channel: 'stable'

      - name: Verify shared application code stays aligned
        working-directory: .
        run: |
          diff -qr mobile-android/lib mobile-ios/lib
          diff -qr mobile-android/test mobile-ios/test
          diff -q mobile-android/pubspec.lock mobile-ios/pubspec.lock

      - name: flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      - name: Verify test/ directory is present and non-empty
        # Iteration 1.1 point 1 (this review round): `flutter test` with
        # no arguments silently reports "0 tests passed" if the test/
        # directory were ever empty or excluded — that would look like a
        # green pipeline while testing nothing. This step fails loudly
        # instead, BEFORE `flutter test` runs, if the expected mobile test suite
        # is no longer actually present.
        run: |
          test -d test
          count=$(find test -name "*_test.dart" | wc -l)
          echo "Found $count test file(s) under test/"
          if [ "$count" -lt 24 ]; then
            echo "Expected at least 24 test files (offline_lease, module_version_gate, activation_service, config_service, device_status_interpretation, pending_action_json_roundtrip, preflight_gate, deep_link_service, sync_snapshot, capabilities_dashboard_adapter, schema_migration, user_session_service, api_client_parish_headers, module_descriptor, local_snapshot_server, snapshot_store, page_resource_downloader, snapshot_capture_service, offline_page_coordinator, offline_isolation_integration, snapshot_encryptor, secure_storage_snapshot_key, device_settings_screen, secure_storage_legacy_remember_token) — found $count. Failing rather than silently running fewer tests than intended."
            exit 1
          fi

      - name: flutter test
        # No --reporter flag needed for pass/fail: `flutter test` exits
        # non-zero on ANY failing test, which fails this step, which fails
        # the job — no `|| true`, no continue-on-error, anywhere in this
        # workflow. `flutter test` also runs every file under test/
        # recursively by default, so all 7 files verified above are
        # actually executed by this one command, not cherry-picked.
        # TEMPORARY DIAGNOSTIC (revert after use): surfaces each failing
        # test's name and message as an annotation, because job logs are not
        # reachable from the authoring environment.
        run: |
          set -o pipefail
          flutter test --concurrency=1 --reporter json | python3 -c '
          import json, sys
          names = {}
          prints = {}
          failed = 0
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  e = json.loads(line)
              except Exception:
                  continue
              t = e.get("type")
              if t == "testStart":
                  names[e["test"]["id"]] = e["test"]["name"]
              elif t == "print":
                  prints.setdefault(e["testID"], []).append(e.get("message") or "")
              elif t == "error":
                  failed += 1
                  msg = (e.get("error") or "").replace("\n", " | ")[:300]
                  dump = " | ".join(prints.get(e["testID"], [])).replace("\n", " | ")
                  keep = dump[:1400]
                  print("::error title=TEST FAILED::%s :: %s :: PRINTS: %s" % (names.get(e["testID"], "?"), msg, keep))
              sys.stdout.flush()
          sys.exit(1 if failed else 0)
          '
